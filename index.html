<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DELI’O Premium Gift Set</title>
  <meta name="description" content="델리오 프리미엄 과일 선물세트 및 기업·단체 B2B 주문 안내">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background:#f7f3eb; }
    body {
      margin: 0;
      background: #f7f3eb;
      color: #16271d;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: 100%; overflow: hidden; }
    .section {
      width: 100%;
      margin: 0;
      padding: 0;
      line-height: 0;
      background: #f7f3eb;
      scroll-margin-top: 10px;
    }
    .section img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
    .floating-cta {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      background: #173621;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
      box-shadow: 0 12px 30px rgba(17, 48, 30, .20);
      border: 1px solid rgba(255,255,255,.14);
    }
    .floating-cta span { margin-left: 10px; font-size: 19px; }
    .top-link {
      position: fixed;
      left: 18px;
      bottom: 22px;
      z-index: 49;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(23,54,33,.14);
      color: #173621;
      text-decoration: none;
      font-weight: 900;
      box-shadow: 0 8px 22px rgba(17, 48, 30, .10);
    }
    @media (max-width: 760px) {
      .floating-cta {
        left: 14px;
        right: 14px;
        bottom: 14px;
        min-height: 50px;
        font-size: 14px;
      }
      .top-link { display:none; }
      body { padding-bottom: 68px; }
    }
  </style>
</head>
<body id="top">
  <main>
    <section class="section" id="hero">
      <img src="assets/01-hero.png" alt="델리오 프리미엄 선물세트 소개">
    </section>
    <section class="section" id="why-delio">
      <img src="assets/02-why-delio.png" alt="델리오가 과일을 고르는 기준">
    </section>
    <section class="section" id="gift-collection">
      <img src="assets/03-gift-collection.png" alt="델리오 선물세트 라인업">
    </section>
    <section class="section" id="gift-experience">
      <img src="assets/04-gift-experience.png" alt="델리오 선물 포장과 받는 경험">
    </section>
    <section class="section" id="b2b-service">
      <img src="assets/05-b2b-service.png" alt="기업 단체 B2B 주문 서비스">
    </section>
    <section class="section" id="order-process">
      <img src="assets/06-order-process.png" alt="기업 주문 진행 과정">
    </section>
    <section class="section" id="faq">
      <img src="assets/07-faq.png" alt="기업 담당자가 자주 묻는 질문">
    </section>
    <section class="section" id="contact">
      <img src="assets/08-contact.png" alt="델리오 기업 단체 견적 문의">
    </section>
  </main>

  <a class="floating-cta" href="#contact" aria-label="기업 단체 견적 문의 섹션으로 이동">
    기업·단체 견적 문의 <span>→</span>
  </a>
  <a class="top-link" href="#top" aria-label="페이지 맨 위로">↑</a>
</body>
</html>
